<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini CRM System</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e293b);
    min-height:100vh;
    color:white;
    padding:30px;
}

.container{
    max-width:1200px;
    margin:auto;
}

h1{
    text-align:center;
    margin-bottom:30px;
    color:#38bdf8;
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:30px;
}

.card{
    background:#1e293b;
    padding:20px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,0.4);
}

.card h2{
    color:#38bdf8;
    margin-bottom:10px;
}

.form-section{
    background:#1e293b;
    padding:25px;
    border-radius:15px;
    margin-bottom:30px;
}

.form-group{
    margin-bottom:15px;
}

input,select,textarea{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    margin-top:5px;
}

button{
    background:#38bdf8;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#0284c7;
}

.table-container{
    background:#1e293b;
    padding:20px;
    border-radius:15px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:12px;
    text-align:left;
}

th{
    background:#334155;
}

tr:nth-child(even){
    background:#273549;
}

.status-new{
    color:#facc15;
    font-weight:bold;
}

.status-contacted{
    color:#38bdf8;
    font-weight:bold;
}

.status-converted{
    color:#22c55e;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>🚀 Client Lead Management System (Mini CRM)</h1>

<div class="dashboard">

<div class="card">
<h2 id="totalLeads">0</h2>
<p>Total Leads</p>
</div>

<div class="card">
<h2 id="newLeads">0</h2>
<p>New Leads</p>
</div>

<div class="card">
<h2 id="convertedLeads">0</h2>
<p>Converted</p>
</div>

</div>

<div class="form-section">

<h2>Add New Lead</h2>
<br>

<div class="form-group">
<input type="text" id="name" placeholder="Client Name">
</div>

<div class="form-group">
<input type="email" id="email" placeholder="Email Address">
</div>

<div class="form-group">
<input type="text" id="source" placeholder="Lead Source">
</div>

<div class="form-group">
<select id="status">
<option>New</option>
<option>Contacted</option>
<option>Converted</option>
</select>
</div>

<div class="form-group">
<textarea id="notes" placeholder="Notes"></textarea>
</div>

<button onclick="addLead()">Add Lead</button>

</div>

<div class="table-container">

<h2>Lead List</h2>
<br>

<table>

<thead>
<tr>
<th>Name</th>
<th>Email</th>
<th>Source</th>
<th>Status</th>
<th>Notes</th>
</tr>
</thead>

<tbody id="leadTable">
</tbody>

</table>

</div>

</div>

<script>

let leads = [];

function addLead(){

let name = document.getElementById("name").value;
let email = document.getElementById("email").value;
let source = document.getElementById("source").value;
let status = document.getElementById("status").value;
let notes = document.getElementById("notes").value;

if(name === "" || email === ""){
    alert("Please fill required fields");
    return;
}

let lead = {
    name,
    email,
    source,
    status,
    notes
};

leads.push(lead);

displayLeads();
updateDashboard();

document.getElementById("name").value="";
document.getElementById("email").value="";
document.getElementById("source").value="";
document.getElementById("notes").value="";
}

function displayLeads(){

let table = document.getElementById("leadTable");
table.innerHTML="";

leads.forEach(lead => {

let statusClass = "";

if(lead.status==="New"){
    statusClass="status-new";
}
else if(lead.status==="Contacted"){
    statusClass="status-contacted";
}
else{
    statusClass="status-converted";
}

table.innerHTML += `
<tr>
<td>${lead.name}</td>
<td>${lead.email}</td>
<td>${lead.source}</td>
<td class="${statusClass}">${lead.status}</td>
<td>${lead.notes}</td>
</tr>
`;

});

}

function updateDashboard(){

document.getElementById("totalLeads").innerText = leads.length;

document.getElementById("newLeads").innerText =
leads.filter(l => l.status==="New").length;

document.getElementById("convertedLeads").innerText =
leads.filter(l => l.status==="Converted").length;

}

</script>

</body>
</html>
